apiVersion: apps/v1
kind: Deployment
metadata:
  name: langgraph-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: langgraph-web
  template:
    metadata:
      labels:
        app: langgraph-web
    spec:
      containers:
        - name: web
          image: your-registry/langgraph-web:latest
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: langgraph-web
spec:
  selector:
    app: langgraph-web
  ports:
    - port: 80
      targetPort: 5173
